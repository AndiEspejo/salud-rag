[project]
name = "salud-rag"
version = "0.1.0"
description = "Spanish health Q&A assistant with retrieval, citations, abstention, and evaluation. Not medical advice."
readme = "README.md"
authors = [
    { name = "Andres", email = "142125446+AndiEspejo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebooks: `spark` is a runtime global and imports follow sys.path setup.
"notebooks/*" = ["F821", "E402"]
